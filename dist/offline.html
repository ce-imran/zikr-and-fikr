<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Dhikr & Fikr Daily Reflections</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0c100d;
      color: #f5f5f4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #141a16;
      border: 1px solid rgba(197, 155, 39, 0.4);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: inline-block;
    }
    h1 {
      font-size: 1.75rem;
      color: #c59b27;
      margin-bottom: 0.75rem;
      font-weight: 700;
    }
    p {
      color: #a8a29e;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-block;
      background: #c59b27;
      color: #0c100d;
      font-weight: 700;
      padding: 0.85rem 1.75rem;
      border-radius: 0.6rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }
    footer {
      margin-top: 2rem;
      font-size: 0.875rem;
      color: #a8a29e;
    }
    footer a {
      color: #c59b27;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌙</div>
    <h1>You are Offline</h1>
    <p>Your internet connection is currently unavailable. Dhikr & Fikr will resume loading daily reflections as soon as connection is restored.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection 🔄</button>
  </div>
  <footer>
    Made with ❤️ by <a href="https://ceimran.in" target="_blank" rel="noopener noreferrer">Imran Ahmad</a>
  </footer>
</body>
</html>
